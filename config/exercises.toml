# Exercise metadata: which muscles each exercise trains, and (optionally) how
# it's measured. This file never combines exercises; see `fitness merge`.
#
# Format, one table per exercise name exactly as Strong logs it:
#
#   [exercise."Bench Press (Barbell)"]
#   primary = ["chest"]                    # each hard set counts 1 set here
#   secondary = ["triceps", "front_delts"] # ... and half a set here
#   kind = "loaded"                        # optional: loaded, assisted, timed, unloaded
#
# `kind` overrides the measurement type the program infers from the name and
# data. Leave it out unless the inference is wrong.
#
# Muscle vocabulary (any other name is ignored with a warning):
#   chest, front_delts, side_delts, rear_delts, triceps, biceps, forearms,
#   lats, upper_back, lower_back, abs, obliques, quads, hamstrings, glutes,
#   adductors, abductors, calves
#
# "Hard sets" are normal, failure and drop sets; warm-ups never count.
# Exercises missing from this file get a keyword-based guess for stats (shown
# as a guess). List them with: fitness exercises --unmapped
# An exercise combined into another (fitness merge) uses the kept name's entry.

# --- Chest -------------------------------------------------------------------

[exercise."Bench Press (Barbell)"]
primary = ["chest"]
secondary = ["triceps", "front_delts"]

[exercise."Bench Press (Smith Machine)"]
primary = ["chest"]
secondary = ["triceps", "front_delts"]

[exercise."Chest Press (Machine)"]
primary = ["chest"]
secondary = ["triceps", "front_delts"]

# Incline pressing shifts work toward the upper chest and front delts.
[exercise."Incline Bench Press (Barbell)"]
primary = ["chest"]
secondary = ["front_delts", "triceps"]

[exercise."Incline Bench Press (Dumbbell)"]
primary = ["chest"]
secondary = ["front_delts", "triceps"]

[exercise."Incline Bench Press (Smith Machine)"]
primary = ["chest"]
secondary = ["front_delts", "triceps"]

[exercise."Incline Chest Press (Machine)"]
primary = ["chest"]
secondary = ["front_delts", "triceps"]

# Decline pressing uses little front delt.
[exercise."Decline Bench Press (Barbell)"]
primary = ["chest"]
secondary = ["triceps"]

[exercise."Decline Press (Machine - Plate Loaded)"]
primary = ["chest"]
secondary = ["triceps"]

[exercise."Chest Dip (Assisted)"]
primary = ["chest", "triceps"]
secondary = ["front_delts"]

[exercise."Chest Fly"]
primary = ["chest"]
secondary = ["front_delts"]

[exercise."Chest Fly (Cable)"]
primary = ["chest"]
secondary = ["front_delts"]

[exercise."Chest Fly (Dumbbell)"]
primary = ["chest"]
secondary = ["front_delts"]

[exercise."Pec Deck (Machine)"]
primary = ["chest"]
secondary = ["front_delts"]

